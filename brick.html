<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Brick Breaker</title>
<meta name="theme-color" content="#0b0d11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">

<body>
<a class="arcade-back" href="./"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 5 8l5 5"/></svg>Arcade</a>
<style>
  :root{
    color-scheme:dark;
    --ground:#0b0d11;
    --ground-hi:#1a1f2b;
    --ink:#c9cfdb;
    --muted:#7c8497;
    --chrome:#b9c1ce;
    --accent:#5fb4ff;
    --call:#4fe07a;
    --end:#ff4d5e;
  }
  html,body{height:100%}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  .arcade-back{position:fixed;z-index:50;left:calc(10px + env(safe-area-inset-left,0px));top:calc(8px + env(safe-area-inset-top,0px));display:inline-flex;align-items:center;gap:4px;padding:6px 11px 6px 8px;border-radius:999px;background:rgba(10,12,20,.55);border:1px solid rgba(255,255,255,.22);color:#fff;font:600 13px "Chakra Petch",system-ui,sans-serif;text-decoration:none;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.arcade-back svg{width:14px;height:14px}
  body{
    background:radial-gradient(120% 70% at 50% 0%,var(--ground-hi) 0%,var(--ground) 62%);
    background-color:var(--ground);
    color:var(--ink);
    font-family:"Chakra Petch",system-ui,sans-serif;
    padding-block:max(52px,calc(env(safe-area-inset-top) + 44px)) max(18px,env(safe-area-inset-bottom));
    padding-inline:16px;
    box-sizing:border-box;
    min-height:100%;
    display:flex;flex-direction:column;align-items:center;gap:18px;
  }
  .phone{
    width:min(100%,430px);box-sizing:border-box;position:relative;
    background:linear-gradient(160deg,#3c4048 0%,#1e2025 42%,#111215 100%);
    border-radius:42px 42px 30px 30px;
    padding:14px 16px 20px;
    box-shadow:0 34px 70px -24px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.13),inset 0 -2px 0 rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.04);
  }
  .top{display:flex;justify-content:center;align-items:center;height:22px;position:relative;margin-bottom:6px}
  .speaker{width:72px;height:5px;border-radius:3px;background:repeating-linear-gradient(90deg,#08090b 0 2px,#2b2e35 2px 4px)}
  .led{position:absolute;right:16px;top:7px;width:7px;height:7px;border-radius:50%;background:#1b241c;transition:background .15s,box-shadow .15s}
  .led.green{background:#57ff7a;box-shadow:0 0 9px #57ff7a}
  .led.red{background:var(--end);box-shadow:0 0 9px var(--end)}
  .bezel{background:#040506;border-radius:12px;padding:8px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),inset 0 2px 8px rgba(0,0,0,.9)}
  canvas{display:block;width:100%;aspect-ratio:4/3;max-width:100%;border-radius:3px;touch-action:none;cursor:none;background:#05070f}
  .nav{display:grid;grid-template-columns:1fr 1fr auto 1fr 1fr;gap:10px;align-items:center;margin-top:14px;padding-inline:2px}
  .kn{
    height:30px;border:0;border-radius:9px;cursor:pointer;color:var(--chrome);
    background:linear-gradient(#2d3037,#1a1c21);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 2px 0 #07080a;
    display:grid;place-items:center;padding:0;
  }
  .kn:active{transform:translateY(1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 1px 0 #07080a}
  .kn svg{width:17px;height:17px;display:block}
  .kn.call{color:var(--call)} .kn.end{color:var(--end)}
  .ball{
    width:34px;height:34px;border-radius:50%;border:0;cursor:pointer;padding:0;
    background:radial-gradient(circle at 35% 30%,#fff 0,#cfdaeb 16%,#5a6981 58%,#1a2130 100%);
    box-shadow:0 0 0 4px #0a0b0e,0 0 0 5px rgba(255,255,255,.12);
    transition:box-shadow .2s;
  }
  .ball.glow{box-shadow:0 0 0 4px #0a0b0e,0 0 0 5px rgba(255,255,255,.14),0 0 16px 4px rgba(95,180,255,.55)}
  .ball:active{transform:scale(.96)}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .keys{margin-top:14px;display:grid;gap:5px}
  .row{
    display:grid;grid-template-columns:repeat(10,1fr);gap:4px;padding-top:5px;
    border-top:2px solid transparent;
    border-image:linear-gradient(90deg,transparent 0%,#9aa2b0 12%,#e3e8ef 50%,#9aa2b0 88%,transparent 100%) 1;
  }
  .k{
    height:22px;border-radius:5px 5px 9px 9px;
    background:linear-gradient(#393c44,#1f2126);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 1px 0 #050506;
    font:700 9px Silkscreen,"Courier New",monospace;color:#dde2ea;
    display:grid;place-items:center;user-select:none;
  }
  .under{width:min(100%,430px);display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
  .help{display:flex;flex-wrap:wrap;gap:6px 14px}
  kbd{font:700 10px Silkscreen,"Courier New",monospace;color:var(--ink);background:#1b1f27;border:1px solid #2c3240;border-bottom-width:2px;border-radius:4px;padding:1px 5px;letter-spacing:.04em}
  .snd{font:600 12px "Chakra Petch",system-ui,sans-serif;color:var(--ink);background:#1b1f27;border:1px solid #2c3240;border-radius:999px;padding:5px 12px;cursor:pointer}
  .snd[aria-pressed="false"]{color:var(--muted)}
  @media (max-width:380px){ .phone{padding-inline:12px;border-radius:34px 34px 24px 24px} .k{height:19px;font-size:8px} }
</style>

<div class="phone">
  <div class="top"><div class="speaker"></div><div class="led" id="led"></div></div>
  <div class="bezel"><canvas id="screen" width="320" height="240" aria-label="Brick Breaker game screen"></canvas></div>
  <div class="nav">
    <button class="kn call" id="bCall" title="Launch ball" aria-label="Launch ball">
      <svg viewBox="0 0 20 20" fill="currentColor"><path d="M5 2.5h3l1.6 4-2.1 1.4a10 10 0 0 0 4.6 4.6l1.4-2.1 4 1.6v3a2 2 0 0 1-2 2A15.5 15.5 0 0 1 3 4.5a2 2 0 0 1 2-2z"/></svg>
    </button>
    <button class="kn" id="bMenu" title="Pause" aria-label="Pause">
      <svg viewBox="0 0 20 20" fill="currentColor"><rect x="4" y="5" width="12" height="2" rx="1"/><rect x="4" y="9" width="12" height="2" rx="1"/><rect x="4" y="13" width="12" height="2" rx="1"/></svg>
    </button>
    <button class="ball" id="bBall" title="Launch / fire" aria-label="Launch or fire"></button>
    <button class="kn" id="bBack" title="Sound on/off" aria-label="Toggle sound">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5 4 9l4 4"/><path d="M4 9h8a4 4 0 0 1 0 8h-2"/></svg>
    </button>
    <button class="kn end" id="bEnd" title="Pause, press again to quit" aria-label="Pause, press again to quit">
      <svg viewBox="0 0 20 20" fill="currentColor"><path transform="rotate(135 10 10)" d="M5 2.5h3l1.6 4-2.1 1.4a10 10 0 0 0 4.6 4.6l1.4-2.1 4 1.6v3a2 2 0 0 1-2 2A15.5 15.5 0 0 1 3 4.5a2 2 0 0 1 2-2z"/></svg>
    </button>
  </div>
  <div class="keys" aria-hidden="true">
    <div class="row"><span class="k">Q</span><span class="k">W</span><span class="k">E</span><span class="k">R</span><span class="k">T</span><span class="k">Y</span><span class="k">U</span><span class="k">I</span><span class="k">O</span><span class="k">P</span></div>
    <div class="row"><span class="k">A</span><span class="k">S</span><span class="k">D</span><span class="k">F</span><span class="k">G</span><span class="k">H</span><span class="k">J</span><span class="k">K</span><span class="k">L</span><span class="k">DEL</span></div>
    <div class="row"><span class="k">ALT</span><span class="k">Z</span><span class="k">X</span><span class="k">C</span><span class="k">V</span><span class="k">B</span><span class="k">N</span><span class="k">M</span><span class="k">$</span><span class="k">ENT</span></div>
  </div>
</div>

<div class="under">
  <div class="help">
    <span><kbd>←</kbd> <kbd>→</kbd> or mouse / drag to move</span>
    <span><kbd>SPACE</kbd> or tap to launch &amp; fire</span>
    <span><kbd>P</kbd> pause</span>
  </div>
  <button class="snd" id="snd" aria-pressed="true">Sound on</button>
</div>

<script>
(()=>{
const cv=document.getElementById('screen'),ctx=cv.getContext('2d');
const W=320,H=240,TOP=16,COLS=12,BW=24,BH=10,GAP=1,OX=10,OY=30,PY=222,PH=6,R=3,STEP=1/120;
let k=1;
function resize(){const r=cv.getBoundingClientRect();const dpr=Math.min(window.devicePixelRatio||1,3);cv.width=Math.max(1,Math.round(r.width*dpr));cv.height=Math.max(1,Math.round(r.width*.75*dpr));k=cv.width/W;}
try{new ResizeObserver(resize).observe(cv)}catch(e){addEventListener('resize',resize)}
resize();

const COLORS={r:'#ff4d5e',o:'#ff9a3c',y:'#ffd84a',g:'#4fe07a',b:'#3fa9ff',p:'#b46bff','2':'#c7d0de'};
const LEVELS=[
 ["............","rrrrrrrrrrrr","oooooooooooo","yyyyyyyyyyyy","gggggggggggg","bbbbbbbbbbbb"],
 [".....pp.....","....pbbp....","...pbggbp...","..pbgyygbp..",".pbgyrrygbp.","pbgyr22rygbp"],
 ["222222222222","r.r.r.r.r.r.",".o.o.o.o.o.o","y.y.y.y.y.y.",".g.g.g.g.g.g","##..####..##"],
 [".....yy.....","....yrry....","...yr22ry...","..yr2bb2ry..","...yr22ry...","....yrry....",".....yy.....","#..........#"],
 ["..g......g..","...g....g...","..gggggggg..",".gg2gggg2gg.","gggggggggggg","g.gggggggg.g","g.g......g.g","...gg..gg..."],
 ["pppppppppppp","p2222222222p","p2bbbbbbbb2p","p2b######b2p","p2bbbbbbbb2p","p2222222222p","pppppppppppp"],
 ["rr..yy..bb..","rr..yy..bb..","22..22..22..","oo..gg..pp..","oo..gg..pp..","#...#...#..."],
 ["..rr....rr..",".rrrr..rrrr.","rrrrrrrrrrrr","rrrr2222rrrr",".rrrrrrrrrr.","..rrrrrrrr..","...rrrrrr...","....rrrr....",".....rr....."],
 ["2r2r2r2r2r2r","o2o2o2o2o2o2","2y2y2y2y2y2y","g2g2g2g2g2g2","2b2b2b2b2b2b","p2p2p2p2p2p2","#.#.#..#.#.#"],
 ["bbbbbbbbbbbb","b##########b","b2222222222b","b2pppppppp2b","b2p######p2b","b2pyyyyyyp2b","b2222222222b",".....##....."]
];
const PU=[
 {k:'L',name:'LONG PADDLE',col:'#3fa9ff',w:3},
 {k:'S',name:'SHORT PADDLE',col:'#ff4d5e',w:2},
 {k:'M',name:'MULTI BALL',col:'#b46bff',w:3},
 {k:'C',name:'CATCH',col:'#4fe07a',w:2},
 {k:'G',name:'LASER GUN',col:'#ff9a3c',w:2},
 {k:'W',name:'SLOW BALL',col:'#7fe3ff',w:2},
 {k:'F',name:'FLIP',col:'#ff6fb5',w:1},
 {k:'+',name:'EXTRA LIFE',col:'#ffd84a',w:1}
];
const PU_TOTAL=PU.reduce((a,p)=>a+p.w,0);

let state='title',score=0,hi=0,lives=3,level=0,round=0,baseSpeed=150,speed=150,maxSpeed=240;
let bricks=[],balls=[],pups=[],lasers=[],parts=[],popups=[];
const paddle={x:W/2,w:44,tw:44};
let catchT=0,gunT=0,flipT=0,fireCd=0,bannerT=0,banner='',clearT=0,overT=0,shakeT=0,time=0,brickSndT=0,newBest=false,endArmed=false;
let targetRaw=null;const keys={left:false,right:false};
try{hi=+localStorage.getItem('bb-hi')||0}catch(e){}
const stars=Array.from({length:70},()=>({x:Math.random()*W,y:TOP+Math.random()*(H-TOP),s:Math.random()<.2?1.5:1,p:Math.random()*6.28}));

/* ---------- audio ---------- */
let actx=null,muted=false;
function ensureAudio(){if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(actx&&actx.state==='suspended')actx.resume();}
function beep(f,dur=.06,type='square',vol=.045,slide=0,delay=0){
  if(muted||!actx)return;const t=actx.currentTime+delay;
  const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+dur+.03);
}
const sfx={
  paddle:()=>beep(330,.07,'square',.05,120),
  wall:()=>beep(220,.03,'square',.025),
  brick:(row)=>{if(brickSndT>0)return;brickSndT=.03;beep(520+(9-row)*45,.06,'square',.04)},
  steel:()=>beep(1250,.08,'triangle',.05),
  pup:()=>{[660,880,1100].forEach((f,i)=>beep(f,.07,'triangle',.05,0,i*.06))},
  laser:()=>beep(900,.08,'sawtooth',.025,-600),
  lose:()=>{[440,330,220,150].forEach((f,i)=>beep(f,.14,'square',.05,-40,i*.12))},
  clear:()=>{[523,659,784,1047].forEach((f,i)=>beep(f,.12,'square',.045,0,i*.1))},
  launch:()=>beep(500,.06,'square',.04,300)
};

/* ---------- game setup ---------- */
function loadLevel(i){
  bricks=[];const map=LEVELS[i%LEVELS.length];
  map.forEach((row,r)=>{for(let c=0;c<COLS;c++){const ch=row[c]||'.';if(ch==='.')continue;
    bricks.push({x:OX+c*(BW+GAP),y:OY+r*(BH+GAP),row:r,ch,hp:ch==='#'?Infinity:ch==='2'?2:1,alive:true,flash:0});}});
}
function setSpeeds(){baseSpeed=150+level*5+round*25;maxSpeed=baseSpeed*1.6;speed=baseSpeed;}
function resetBall(){
  balls=[{x:paddle.x,y:PY-R-.5,vx:0,vy:0,stuck:true,offset:(Math.random()<.5?-1:1)*6,autoT:0}];
  pups=[];lasers=[];paddle.tw=44;catchT=gunT=flipT=0;speed=baseSpeed;
}
function newGame(){
  score=0;lives=3;level=0;round=0;newBest=false;paddle.x=W/2;paddle.w=44;
  loadLevel(0);setSpeeds();resetBall();state='play';showBanner('LEVEL 1');parts=[];popups=[];
}
function showBanner(t){banner=t;bannerT=1.8;}
function nextLevel(){
  level++;if(level>=LEVELS.length){level=0;round++;}
  loadLevel(level);setSpeeds();resetBall();state='play';
  showBanner(round?`LEVEL ${level+1}  ROUND ${round+1}`:`LEVEL ${level+1}`);
}
function levelLabel(){return round?`${level+1}-${round+1}`:`${level+1}`}

/* ---------- actions ---------- */
function launchBall(b){
  const rel=Math.max(-1,Math.min(1,b.offset/(paddle.w/2)));let a=rel*1.0;
  if(Math.abs(a)<.18)a=(a<0?-1:1)*.18;
  b.vx=speed*Math.sin(a);b.vy=-speed*Math.cos(a);b.stuck=false;b.autoT=0;
}
function fire(){
  if(fireCd>0)return;const x0=paddle.x-paddle.w/2;
  lasers.push({x:x0+3,y:PY-3},{x:x0+paddle.w-3,y:PY-3});fireCd=.22;sfx.laser();
}
function action(){
  ensureAudio();
  if(state==='title'){newGame();return}
  if(state==='over'){if(overT>.8)newGame();return}
  if(state==='paused'){state='play';endArmed=false;return}
  if(state!=='play')return;
  const stuck=balls.filter(b=>b.stuck);
  if(stuck.length){stuck.forEach(launchBall);sfx.launch();bannerT=Math.min(bannerT,.4);return}
  if(gunT>0)fire();
}
function togglePause(){
  if(state==='play'){state='paused';keys.left=keys.right=false}
  else if(state==='paused'){state='play';endArmed=false}
}
function multi(){
  const nb=[];
  for(const b of balls){
    if(b.stuck)launchBall(b);
    const a0=Math.atan2(b.vx,-b.vy);
    for(const d of [-.45,.45]){if(balls.length+nb.length>=12)break;const a=a0+d;
      nb.push({x:b.x,y:b.y,vx:speed*Math.sin(a),vy:-speed*Math.cos(a),stuck:false,offset:0,autoT:0});}
  }
  balls.push(...nb);
}
function applyPU(p){
  score+=25;sfx.pup();popups.push({x:p.x,y:PY-10,text:p.name,col:p.col,t:1.3});
  switch(p.k){
    case 'L':paddle.tw=66;break;
    case 'S':paddle.tw=28;break;
    case 'M':multi();break;
    case 'C':catchT=15;break;
    case 'G':gunT=12;break;
    case 'W':speed=Math.max(baseSpeed*.75,speed*.7);break;
    case 'F':flipT=8;break;
    case '+':lives=Math.min(9,lives+1);break;
  }
}
function pickPU(){let r=Math.random()*PU_TOTAL;for(const p of PU){r-=p.w;if(r<=0)return p}return PU[0]}

function burst(x,y,col,n=8){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=30+Math.random()*70;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-20,life:.5+Math.random()*.3,col})}}
function hitBrick(b){
  if(b.ch==='#'){b.flash=1;sfx.steel();return}
  b.hp--;b.flash=1;
  if(b.hp<=0){
    b.alive=false;score+=b.ch==='2'?25:10;sfx.brick(b.row);
    burst(b.x+BW/2,b.y+BH/2,COLORS[b.ch]);
    speed=Math.min(maxSpeed,speed+.9);
    if(Math.random()<.16){const p=pickPU();pups.push({...p,x:b.x+BW/2,y:b.y+BH/2})}
  }else{score+=5;sfx.steel()}
}
function loseLife(){
  lives--;shakeT=.35;sfx.lose();
  if(lives<=0){
    state='over';overT=0;
    if(score>hi){hi=score;newBest=true;try{localStorage.setItem('bb-hi',String(hi))}catch(e){}}
  }else{resetBall();showBanner('BALL LOST')}
}

/* ---------- update ---------- */
function update(dt){
  catchT=Math.max(0,catchT-dt);gunT=Math.max(0,gunT-dt);flipT=Math.max(0,flipT-dt);fireCd=Math.max(0,fireCd-dt);brickSndT=Math.max(0,brickSndT-dt);
  // paddle
  let dir=(keys.right?1:0)-(keys.left?1:0);if(flipT>0)dir=-dir;
  if(dir){paddle.x+=dir*250*dt}
  else if(targetRaw!==null){const tx=flipT>0?W-targetRaw:targetRaw;paddle.x+=(tx-paddle.x)*Math.min(1,dt*28)}
  paddle.w+=(paddle.tw-paddle.w)*Math.min(1,dt*8);
  paddle.x=Math.max(paddle.w/2,Math.min(W-paddle.w/2,paddle.x));
  const left=paddle.x-paddle.w/2,right=paddle.x+paddle.w/2;

  for(const b of balls){
    if(b.stuck){
      b.offset=Math.max(-paddle.w/2+2,Math.min(paddle.w/2-2,b.offset));
      b.x=paddle.x+b.offset;b.y=PY-R-.5;
      if(b.autoT>0){b.autoT-=dt;if(b.autoT<=0){launchBall(b);sfx.launch()}}
      continue;
    }
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.x<R){b.x=R;b.vx=Math.abs(b.vx);sfx.wall()}
    else if(b.x>W-R){b.x=W-R;b.vx=-Math.abs(b.vx);sfx.wall()}
    if(b.y<TOP+R){b.y=TOP+R;b.vy=Math.abs(b.vy);sfx.wall()}
    // paddle
    if(b.vy>0&&b.y+R>=PY&&b.y-R<=PY+PH&&b.x>=left-R&&b.x<=right+R){
      const rel=Math.max(-1,Math.min(1,(b.x-paddle.x)/(paddle.w/2)));const a=rel*1.05;
      b.vx=speed*Math.sin(a);b.vy=-speed*Math.cos(a);b.y=PY-R;sfx.paddle();
      if(catchT>0){b.stuck=true;b.offset=b.x-paddle.x;b.autoT=2.5}
      continue;
    }
    // bricks
    for(const br of bricks){
      if(!br.alive)continue;
      const cx=Math.max(br.x,Math.min(b.x,br.x+BW)),cy=Math.max(br.y,Math.min(b.y,br.y+BH));
      const dx=b.x-cx,dy=b.y-cy;
      if(dx*dx+dy*dy<R*R){
        if(Math.abs(dx)>Math.abs(dy)){b.vx=(dx>0?1:-1)*Math.abs(b.vx);b.x=cx+(dx>0?R:-R)}
        else if(dy!==0){b.vy=(dy>0?1:-1)*Math.abs(b.vy);b.y=cy+(dy>0?R:-R)}
        else{b.vy=-b.vy;b.y-=b.vy*dt*2}
        hitBrick(br);break;
      }
    }
    // keep speed consistent and avoid flat angles
    let m=Math.hypot(b.vx,b.vy)||1;b.vx*=speed/m;b.vy*=speed/m;
    const minVy=speed*.28;
    if(Math.abs(b.vy)<minVy){b.vy=(b.vy<0?-1:1)*minVy;b.vx=(b.vx<0?-1:1)*Math.sqrt(speed*speed-minVy*minVy)}
  }
  balls=balls.filter(b=>b.y<H+8);
  // lasers
  for(const l of lasers){l.y-=330*dt;
    for(const br of bricks){if(br.alive&&l.x>=br.x&&l.x<=br.x+BW&&l.y>=br.y&&l.y<=br.y+BH){hitBrick(br);l.dead=true;break}}
    if(l.y<TOP)l.dead=true;}
  lasers=lasers.filter(l=>!l.dead);
  // power-ups
  for(const p of pups){p.y+=55*dt;
    if(p.y+4>=PY&&p.y-4<=PY+PH&&Math.abs(p.x-paddle.x)<=paddle.w/2+9){applyPU(p);p.dead=true}
    else if(p.y>H+6)p.dead=true;}
  pups=pups.filter(p=>!p.dead);
  if(state!=='play')return;
  if(!balls.length){loseLife();return}
  if(!bricks.some(b=>b.alive&&b.ch!=='#')){
    score+=250;sfx.clear();state='clear';clearT=2.2;
    popups.push({x:W/2,y:150,text:'+250 BONUS',col:'#ffd84a',t:1.8});
  }
}
function tickFx(dt){
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=160*dt;p.life-=dt}
  parts=parts.filter(p=>p.life>0);
  for(const p of popups){p.y-=14*dt;p.t-=dt}
  popups=popups.filter(p=>p.t>0);
  for(const b of bricks)if(b.flash>0)b.flash=Math.max(0,b.flash-dt*6);
  shakeT=Math.max(0,shakeT-dt);bannerT=Math.max(0,bannerT-dt);
}

/* ---------- drawing ---------- */
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function txt(s,x,y,size,col,align='center',bold=false){ctx.font=`${bold?700:400} ${size}px Silkscreen, "Courier New", monospace`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillStyle=col;ctx.fillText(s,x,y)}
function drawBg(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0d1f47');g.addColorStop(.55,'#081230');g.addColorStop(1,'#04060e');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const rg=ctx.createRadialGradient(W/2,110,5,W/2,110,170);rg.addColorStop(0,'rgba(80,140,255,.16)');rg.addColorStop(1,'rgba(80,140,255,0)');
  ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);
  for(const s of stars){ctx.globalAlpha=.25+.3*(.5+.5*Math.sin(time*1.6+s.p));ctx.fillStyle='#cfe0ff';ctx.fillRect(s.x,s.y,s.s,s.s)}
  ctx.globalAlpha=1;
  ctx.strokeStyle='rgba(110,160,255,.07)';ctx.lineWidth=.5;
  for(let i=0;i<=8;i++){const y=196+i*i*.9;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
}
function drawBrick(x,y,ch,hp,flash){
  if(ch==='#'){
    const g=ctx.createLinearGradient(0,y,0,y+BH);g.addColorStop(0,'#e0c27a');g.addColorStop(.5,'#9a7c3c');g.addColorStop(1,'#5e4820');
    ctx.fillStyle=g;ctx.fillRect(x,y,BW,BH);
    ctx.fillStyle='rgba(255,240,200,.5)';ctx.fillRect(x,y,BW,1);
    ctx.fillStyle='#f5e2a8';ctx.fillRect(x+2,y+4,1.5,1.5);ctx.fillRect(x+BW-3.5,y+4,1.5,1.5);
  }else{
    ctx.fillStyle=COLORS[ch];ctx.fillRect(x,y,BW,BH);
    ctx.fillStyle='rgba(255,255,255,.4)';ctx.fillRect(x,y,BW,2);
    ctx.fillStyle='rgba(255,255,255,.14)';ctx.fillRect(x,y,1,BH);
    ctx.fillStyle='rgba(0,0,0,.32)';ctx.fillRect(x,y+BH-2,BW,2);ctx.fillRect(x+BW-1,y,1,BH);
    if(ch==='2'&&hp===1){ctx.strokeStyle='rgba(30,40,60,.85)';ctx.lineWidth=.8;ctx.beginPath();ctx.moveTo(x+6,y+1);ctx.lineTo(x+10,y+5);ctx.lineTo(x+8,y+7);ctx.lineTo(x+13,y+9);ctx.moveTo(x+10,y+5);ctx.lineTo(x+17,y+3);ctx.stroke()}
  }
  if(flash>0){ctx.fillStyle=`rgba(255,255,255,${flash*.8})`;ctx.fillRect(x,y,BW,BH)}
}
function drawPaddle(){
  const x0=paddle.x-paddle.w/2,w=paddle.w;
  if(gunT>0){ctx.fillStyle='#ff9a3c';ctx.fillRect(x0+2,PY-3,2,3);ctx.fillRect(x0+w-4,PY-3,2,3)}
  const g=ctx.createLinearGradient(0,PY,0,PY+PH);g.addColorStop(0,'#ffffff');g.addColorStop(.45,'#bcc6d8');g.addColorStop(1,'#5f6a80');
  rr(x0,PY,w,PH,3);ctx.fillStyle=g;ctx.fill();
  ctx.fillStyle=catchT>0?'#4fe07a':'#3fa9ff';
  rr(x0,PY,7,PH,3);ctx.fill();rr(x0+w-7,PY,7,PH,3);ctx.fill();
  if(flipT>0){rr(x0-.5,PY-.5,w+1,PH+1,3.5);ctx.strokeStyle='#ff6fb5';ctx.lineWidth=1;ctx.stroke()}
}
function drawBalls(){
  ctx.shadowColor='#8fd0ff';ctx.shadowBlur=7*k;
  for(const b of balls){ctx.beginPath();ctx.arc(b.x,b.y,R,0,6.283);ctx.fillStyle='#ffffff';ctx.fill()}
  ctx.shadowBlur=0;
  if(state==='play'){
    for(const b of balls){if(!b.stuck||b.autoT>0)continue;
      const rel=Math.max(-1,Math.min(1,b.offset/(paddle.w/2)));let a=rel;if(Math.abs(a)<.18)a=(a<0?-1:1)*.18;
      ctx.fillStyle='rgba(200,225,255,.55)';
      for(let i=1;i<=5;i++){const d=6+i*6;if(Math.floor(time*6)%5===i-1)continue;ctx.fillRect(b.x+Math.sin(a)*d-.5,b.y-Math.cos(a)*d-.5,1,1)}}
  }
}
function drawHUD(){
  ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,0,W,TOP);
  ctx.fillStyle='rgba(120,170,255,.28)';ctx.fillRect(0,TOP-1,W,1);
  txt(String(score).padStart(6,'0'),6,8.5,8,'#e4eeff','left');
  txt('LEVEL '+levelLabel(),W/2,8.5,8,'#8fb8ff');
  const n=Math.min(lives,5);
  for(let i=0;i<n;i++){rr(W-17-i*14,6,12,4,2);ctx.fillStyle='#dfe7f5';ctx.fill();ctx.fillStyle='#3fa9ff';ctx.fillRect(W-17-i*14,6,2.5,4);ctx.fillRect(W-7.5-i*14,6,2.5,4)}
  if(lives>5)txt('+'+(lives-5),W-17-5*14+8,8.5,7,'#dfe7f5','right');
  // active timers
  const fx=[[catchT,15,'C','#4fe07a'],[gunT,12,'G','#ff9a3c'],[flipT,8,'F','#ff6fb5']].filter(f=>f[0]>0);
  fx.forEach((f,i)=>{const x=W-20-i*18,y=TOP+3;rr(x,y,16,8,3);ctx.fillStyle='rgba(0,0,0,.45)';ctx.fill();
    ctx.fillStyle=f[3];ctx.fillRect(x+1,y+7,14*(f[0]/f[1]),1);txt(f[2],x+8,y+4,7,f[3],'center',true)});
}
function overlay(a=.62){ctx.fillStyle=`rgba(3,7,20,${a})`;ctx.fillRect(0,TOP,W,H-TOP)}
function drawTitle(){
  ctx.globalAlpha=.22;LEVELS[1].forEach((row,r)=>{for(let c=0;c<COLS;c++){const ch=row[c];if(ch&&ch!=='.')drawBrick(OX+c*(BW+GAP),24+r*(BH+GAP),ch,2,0)}});ctx.globalAlpha=1;
  txt('BRICK',W/2+2,84,30,'#123a8c','center',true);txt('BRICK',W/2,82,30,'#ffffff','center',true);
  txt('BREAKER',W/2+2,114,30,'#123a8c','center',true);txt('BREAKER',W/2,112,30,'#ffd84a','center',true);
  ['r','o','y','g','b','p'].forEach((c,i)=>{ctx.fillStyle=COLORS[c];ctx.fillRect(W/2-45+i*15,134,14,3)});
  if(Math.floor(time*2.2)%2===0)txt('TAP OR PRESS SPACE',W/2,158,8,'#cfe3ff');
  txt('BEST '+String(hi).padStart(6,'0'),W/2,176,8,'#8fb8ff');
  const bx=W/2+110*Math.sin(time*1.2),by=PY-R-Math.abs(Math.sin(time*3.1))*34;
  const px=W/2+100*Math.sin(time*1.2-.08);
  const g=ctx.createLinearGradient(0,PY,0,PY+PH);g.addColorStop(0,'#fff');g.addColorStop(1,'#5f6a80');
  rr(px-22,PY,44,PH,3);ctx.fillStyle=g;ctx.fill();ctx.fillStyle='#3fa9ff';rr(px-22,PY,7,PH,3);ctx.fill();rr(px+15,PY,7,PH,3);ctx.fill();
  ctx.shadowColor='#8fd0ff';ctx.shadowBlur=7*k;ctx.beginPath();ctx.arc(bx,by,R,0,6.283);ctx.fillStyle='#fff';ctx.fill();ctx.shadowBlur=0;
}
function render(){
  ctx.setTransform(k,0,0,k,0,0);
  if(shakeT>0){const s=shakeT*6;ctx.translate((Math.random()-.5)*s,(Math.random()-.5)*s)}
  drawBg();
  if(state==='title'){drawTitle();return}
  for(const b of bricks)if(b.alive)drawBrick(b.x,b.y,b.ch,b.hp,b.flash);
  for(const p of pups){const bob=1+.08*Math.sin(time*10);
    rr(p.x-9,p.y-4.5,18,9,4.5);ctx.fillStyle=p.col;ctx.fill();ctx.strokeStyle=`rgba(255,255,255,${.5+.3*bob-.3})`;ctx.lineWidth=.7;ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(p.x-6,p.y-3.5,12,1.2);
    txt(p.k,p.x,p.y+.5,7,'#0b1020','center',true)}
  ctx.fillStyle='#ff5a3c';for(const l of lasers){ctx.fillRect(l.x-.5,l.y-4,1.2,5)}
  drawPaddle();drawBalls();
  for(const p of parts){ctx.globalAlpha=Math.max(0,Math.min(1,p.life*2));ctx.fillStyle=p.col;ctx.fillRect(p.x-1,p.y-1,2,2)}
  ctx.globalAlpha=1;
  for(const p of popups){ctx.globalAlpha=Math.min(1,p.t*1.5);txt(p.text,p.x<40?40:p.x>W-40?W-40:p.x,p.y,7,p.col,'center',true)}
  ctx.globalAlpha=1;
  drawHUD();
  if(bannerT>0&&state==='play'){ctx.globalAlpha=Math.min(1,bannerT*2);txt(banner,W/2+1,171,12,'#0b1a3f','center',true);txt(banner,W/2,170,12,'#ffffff','center',true);ctx.globalAlpha=1}
  if(state==='paused'){overlay();txt('PAUSED',W/2,112,20,'#ffffff','center',true);txt(endArmed?'PRESS END AGAIN TO QUIT':'P OR TAP TO RESUME',W/2,140,8,endArmed?'#ff8a95':'#cfe3ff')}
  if(state==='clear'){overlay(.35);txt('LEVEL CLEAR',W/2,118,18,'#ffd84a','center',true)}
  if(state==='over'){overlay(.7);txt('GAME OVER',W/2,92,22,'#ff4d5e','center',true);
    txt('SCORE '+String(score).padStart(6,'0'),W/2,122,9,'#ffffff');
    txt('BEST  '+String(hi).padStart(6,'0'),W/2,138,9,'#8fb8ff');
    if(newBest&&Math.floor(time*3)%2===0)txt('NEW BEST!',W/2,156,9,'#ffd84a','center',true);
    if(overT>.8)txt('TAP OR PRESS SPACE',W/2,184,8,'#cfe3ff');}
}

/* ---------- loop ---------- */
const led=document.getElementById('led'),tb=document.getElementById('bBall');let ledState='';
function setLed(){let s='';
  if(state==='over'||(shakeT>0))s=Math.floor(time*4)%2?'red':'';
  else if(state==='play'&&balls.some(b=>b.stuck&&!(b.autoT>0)))s=Math.floor(time*2)%2?'green':'';
  else if(state==='title')s=Math.floor(time*1.2)%2?'green':'';
  if(s!==ledState){led.className='led'+(s?' '+s:'');ledState=s}
  const glow=state==='play'&&(balls.some(b=>b.stuck)||gunT>0);
  tb.classList.toggle('glow',glow);
}
let last=performance.now(),acc=0;
function frame(now){
  const d=Math.min(.05,(now-last)/1000);last=now;time+=d;
  if(state==='play'){acc+=d;while(acc>=STEP){update(STEP);acc-=STEP;if(state!=='play'){acc=0;break}}}else acc=0;
  if(state!=='paused')tickFx(d);
  if(state==='clear'){clearT-=d;if(clearT<=0)nextLevel()}
  if(state==='over')overT+=d;
  render();setLed();requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- input ---------- */
function localX(e){const r=cv.getBoundingClientRect();return (e.clientX-r.left)/r.width*W}
let touch=null;
cv.addEventListener('pointerdown',e=>{
  ensureAudio();try{cv.setPointerCapture(e.pointerId)}catch(_){}
  targetRaw=localX(e);
  if(e.pointerType==='mouse'){action()}else{touch={x:e.clientX,y:e.clientY,t:performance.now()}}
  e.preventDefault();
});
cv.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||touch)targetRaw=localX(e)});
cv.addEventListener('pointerup',e=>{
  if(e.pointerType!=='mouse'&&touch){const moved=Math.hypot(e.clientX-touch.x,e.clientY-touch.y);
    if(moved<12&&performance.now()-touch.t<320)action();touch=null}
});
cv.addEventListener('pointercancel',()=>{touch=null});
cv.addEventListener('contextmenu',e=>e.preventDefault());

addEventListener('keydown',e=>{
  const kc=e.key;
  if(kc==='ArrowLeft'||kc==='a'||kc==='A'){keys.left=true;targetRaw=null;e.preventDefault()}
  else if(kc==='ArrowRight'||kc==='d'||kc==='D'){keys.right=true;targetRaw=null;e.preventDefault()}
  else if(kc===' '||kc==='ArrowUp'||kc==='Enter'){e.preventDefault();if(!e.repeat||(state==='play'&&gunT>0))action()}
  else if(kc==='p'||kc==='P'||kc==='Escape'){ensureAudio();togglePause()}
  else if(kc==='m'||kc==='M'){toggleSound()}
});
addEventListener('keyup',e=>{
  const kc=e.key;
  if(kc==='ArrowLeft'||kc==='a'||kc==='A')keys.left=false;
  if(kc==='ArrowRight'||kc==='d'||kc==='D')keys.right=false;
  if(kc===' '||kc==='Enter')e.preventDefault();
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')togglePause()});
addEventListener('blur',()=>{keys.left=keys.right=false});

const sndBtn=document.getElementById('snd');
function toggleSound(){muted=!muted;sndBtn.setAttribute('aria-pressed',String(!muted));sndBtn.textContent=muted?'Sound off':'Sound on';if(!muted)ensureAudio()}
function btn(id,fn){const el=document.getElementById(id);el.addEventListener('click',()=>{ensureAudio();fn();el.blur()})}
btn('bCall',action);btn('bBall',action);
btn('bMenu',()=>{if(state==='title'||state==='over')action();else togglePause()});
btn('bBack',toggleSound);
btn('snd',()=>{toggleSound()});
btn('bEnd',()=>{
  if(state==='play'){togglePause();endArmed=true}
  else if(state==='paused'){if(endArmed){state='title';endArmed=false}else endArmed=true}
  else if(state==='over'){state='title'}
});
})();
</script>

<script>document.addEventListener('gesturestart',e=>e.preventDefault());</script>
