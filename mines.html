<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#06131a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Mines</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="stylesheet" href="./fonts.css">
<style>
:root{
  --bg:#06131a; --bg2:#0b2433; --tile1:#2a586f; --tile2:#1b3f53; --edge:#4f9bb8;
  --rev:#071a22; --ink:#eafcff; --dim:#86b6c6; --accent:#46f0c0; --warn:#ff5d6c; --amber:#ffc24a;
  --cw:36px; --ch:36px; --fs:22px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body{background:var(--bg);color:var(--ink);font-family:'Chakra Petch',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-appearance:none;appearance:none;touch-action:manipulation}
a{color:inherit;text-decoration:none}
.app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  background:radial-gradient(120% 70% at 50% 45%,#0e3040 0%,var(--bg2) 38%,var(--bg) 80%)}
/* sonar backdrop */
.sonar{position:absolute;left:50%;top:50%;width:150vmax;height:150vmax;transform:translate(-50%,-50%);pointer-events:none;border-radius:50%;
  background:repeating-radial-gradient(circle,rgba(70,240,192,.07) 0 1px,transparent 1px 90px);
  -webkit-mask-image:radial-gradient(circle,#000 0,#000 30%,transparent 62%);mask-image:radial-gradient(circle,#000 0,#000 30%,transparent 62%)}
.sonar::after{content:"";position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,rgba(70,240,192,.16),rgba(70,240,192,0) 18%,rgba(70,240,192,0) 100%);animation:sweep 7s linear infinite}
@keyframes sweep{to{transform:rotate(360deg)}}

.top{position:relative;z-index:2;flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;padding:4px 8px 0}
.back{display:inline-flex;align-items:center;gap:2px;min-height:44px;padding:0 10px 0 4px;font-weight:600;font-size:15px;color:var(--dim);justify-self:start;letter-spacing:.02em}
.back svg{width:18px;height:18px}
.seg{display:flex;background:rgba(3,14,19,.7);border:1px solid rgba(79,155,184,.35);border-radius:12px;padding:3px;gap:2px}
.seg button{min-width:58px;height:34px;border-radius:9px;font-weight:700;font-size:14px;color:var(--dim);letter-spacing:.03em}
.seg button[aria-pressed=true]{background:linear-gradient(180deg,#59f5cb,#2ec9a0);color:#032319;box-shadow:0 0 14px rgba(70,240,192,.35)}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;justify-self:end;border-radius:12px;color:var(--dim)}
.iconbtn svg{width:24px;height:24px}
.iconbtn .off{display:none}
.iconbtn.muted .on{display:none}.iconbtn.muted .off{display:block}

.stats{position:relative;z-index:2;flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:2px 14px 0;gap:8px}
.stat{display:flex;flex-direction:column;line-height:1}
.stat.r{align-items:flex-end;text-align:right}
.stat .l{font-size:10px;font-weight:600;letter-spacing:.2em;color:var(--dim);margin-bottom:3px}
.stat .v{font-weight:700;font-size:34px;color:var(--accent);text-shadow:0 0 14px rgba(70,240,192,.45);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.stat .b{font-size:11px;color:var(--dim);margin-top:3px;font-weight:600;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.restart{position:relative;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#37758f,#16394b);border:1.5px solid var(--edge);box-shadow:0 3px 0 rgba(0,0,0,.4),0 0 18px rgba(70,240,192,.12)}
.restart svg{width:26px;height:26px}
.restart:active{transform:translateY(2px)}
.restart.armed{border-color:var(--amber);background:radial-gradient(circle at 35% 30%,#7a5a1a,#3d2c0a)}
.restart .tip{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:3px;font-size:10px;font-weight:700;color:var(--amber);white-space:nowrap;display:none;letter-spacing:.08em}
.restart.armed .tip{display:block}

.wrap{position:relative;z-index:1;flex:1 1 0;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px 2px 2px}
.frame{position:relative;padding:5px;border-radius:12px;background:rgba(2,10,14,.62);border:1px solid rgba(70,240,192,.28);
  box-shadow:0 0 0 1px rgba(0,0,0,.4),0 10px 40px rgba(0,0,0,.5),inset 0 0 30px rgba(70,240,192,.05)}
.frame .tag{position:absolute;top:-7px;left:14px;padding:0 6px;background:var(--bg2);font-family:'Silkscreen','Chakra Petch',monospace;font-size:9px;letter-spacing:.14em;color:var(--accent);line-height:12px}
.frame .tag.r{left:auto;right:14px;color:var(--dim)}
.board{display:grid;gap:2px;touch-action:none}
.c{position:relative;width:var(--cw);height:var(--ch);border-radius:5px;display:grid;place-items:center;
  font:800 var(--fs)/1 'Rubik','Chakra Petch',system-ui,sans-serif;
  background:linear-gradient(160deg,var(--tile1),var(--tile2));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -2px 0 rgba(0,0,0,.38),0 0 0 .5px rgba(0,0,0,.4);
  touch-action:none;overflow:hidden}
.c svg{width:68%;height:68%;display:block;pointer-events:none}
.c.f svg{filter:drop-shadow(0 0 4px rgba(255,194,74,.55))}
.c.rv{background:var(--rev);box-shadow:inset 0 0 0 1px rgba(70,240,192,.07)}
.c.pop{animation:pop .42s cubic-bezier(.2,.9,.3,1.15) both;animation-delay:var(--d,0ms)}
@keyframes pop{0%{transform:scale(.55);filter:brightness(2.6) saturate(1.4);opacity:.15}55%{transform:scale(1.07);filter:brightness(1.7)}100%{transform:none;filter:none;opacity:1}}
.n1{color:#52c8ff}.n2{color:#62f28f}.n3{color:#ff6b78}.n4{color:#c5a0ff}.n5{color:#ff9a3c}.n6{color:#ffe14d}.n7{color:#ff84da}.n8{color:#f4f4f4}
.c[class*=" n"],.c.rv:not(.m){text-shadow:0 0 9px currentColor}
.c.m{background:#1a0c12;color:#ff8a96}
.c.m.hit{background:radial-gradient(circle,#ff4b5c 0%,#9b1424 100%);color:#fff;animation:boom .5s ease-out both}
@keyframes boom{0%{transform:scale(.6)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
.c.wrong{background:#2a1218}
.c.wrong::after{content:"";position:absolute;inset:14%;background:
  linear-gradient(45deg,transparent 45%,var(--warn) 45% 55%,transparent 55%),linear-gradient(-45deg,transparent 45%,var(--warn) 45% 55%,transparent 55%)}
.c.lp::after{content:"";position:absolute;left:50%;top:50%;width:100%;aspect-ratio:1;margin:-50% 0 0 -50%;border-radius:50%;
  background:radial-gradient(circle,rgba(70,240,192,.7),rgba(70,240,192,.2));animation:lp .27s linear forwards;pointer-events:none}
@keyframes lp{from{transform:scale(0);opacity:.9}to{transform:scale(1.5);opacity:.95}}
.c.rv.flash{animation:flash .28s ease-out}
@keyframes flash{from{background:#14414f}to{background:var(--rev)}}

.dock{position:relative;z-index:2;flex:none;padding:4px 14px calc(8px + 2px)}
.mode{position:relative;display:grid;grid-template-columns:1fr 1fr;height:62px;border-radius:18px;padding:4px;
  background:rgba(2,10,14,.8);border:1px solid rgba(79,155,184,.4)}
.mode .thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:14px;
  background:linear-gradient(180deg,#59f5cb,#2ec9a0);box-shadow:0 0 20px rgba(70,240,192,.35);transition:transform .22s cubic-bezier(.3,1.2,.4,1),background .2s}
.mode[data-m=flag] .thumb{transform:translateX(100%);background:linear-gradient(180deg,#ffd067,#f0a624);box-shadow:0 0 20px rgba(255,194,74,.35)}
.mode button{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--dim);font-weight:700;font-size:19px;letter-spacing:.06em;transition:color .2s}
.mode button span{font-size:10px;font-weight:600;letter-spacing:.1em;opacity:.8}
.mode button .row{display:flex;align-items:center;gap:7px}
.mode button svg{width:22px;height:22px}
.mode[data-m=dig] button[data-m=dig],.mode[data-m=flag] button[data-m=flag]{color:#05221a}

.ov{position:absolute;inset:0;z-index:10;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(2,8,12,.62);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.ov.show{display:flex;animation:fade .3s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.card{width:100%;max-width:320px;text-align:center;padding:24px 20px 20px;border-radius:20px;background:linear-gradient(180deg,#10394b,#0a2230);border:1.5px solid var(--edge);box-shadow:0 20px 60px rgba(0,0,0,.6);animation:rise .4s cubic-bezier(.2,1,.3,1)}
@keyframes rise{from{transform:translateY(20px) scale(.95);opacity:0}to{transform:none;opacity:1}}
.card h2{margin:0 0 4px;font-family:'Bungee','Chakra Petch',sans-serif;font-weight:400;font-size:30px;letter-spacing:.02em;color:var(--accent);text-shadow:0 0 18px rgba(70,240,192,.5)}
.card.lose h2{color:var(--warn);text-shadow:0 0 18px rgba(255,93,108,.5)}
.card .big{font-weight:700;font-size:54px;line-height:1.1;margin:8px 0 0;font-variant-numeric:tabular-nums}
.card p{margin:4px 0 0;color:var(--dim);font-size:15px;font-weight:600}
.card .newbest{display:inline-block;margin-top:10px;padding:3px 12px;border-radius:999px;background:var(--amber);color:#2b1c00;font-weight:700;font-size:13px;letter-spacing:.1em}
.card .btns{display:grid;gap:10px;margin-top:20px}
.btn{height:52px;border-radius:14px;font-weight:700;font-size:18px;letter-spacing:.04em}
.btn.pri{background:linear-gradient(180deg,#59f5cb,#2ec9a0);color:#032319;box-shadow:0 3px 0 #17775f}
.btn.sec{border:1.5px solid var(--edge);color:var(--ink)}
.btn:active{transform:translateY(2px)}
@media (prefers-reduced-motion:reduce){.sonar::after{animation:none}.c.pop{animation-duration:.01s;animation-delay:0s}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-flag" viewBox="0 0 24 24"><path d="M6 21V3" stroke="#e9f6fa" stroke-width="2.4" stroke-linecap="round"/><path d="M7 4l12 4.6L7 13.2z" fill="#ffc24a" stroke="#ffc24a" stroke-width="1.2" stroke-linejoin="round"/><path d="M3.5 21h8" stroke="#e9f6fa" stroke-width="2.4" stroke-linecap="round"/></symbol>
    <symbol id="i-mine" viewBox="0 0 24 24"><g stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 2.5v4M12 17.5v4M2.5 12h4M17.5 12h4M5.3 5.3l2.8 2.8M15.9 15.9l2.8 2.8M18.7 5.3l-2.8 2.8M8.1 15.9l-2.8 2.8"/></g><circle cx="12" cy="12" r="6.2" fill="currentColor"/><circle cx="10" cy="10" r="1.8" fill="#fff" opacity=".75"/></symbol>
    <symbol id="i-dig" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="7.5"/><path d="M12 1.5v5M12 17.5v5M1.5 12h5M17.5 12h5"/></g><circle cx="12" cy="12" r="1.8" fill="currentColor"/></symbol>
  </defs>
</svg>

<div class="app" id="app">
  <div class="sonar" aria-hidden="true"></div>

  <div class="top">
    <a class="back" href="./" aria-label="Back to Arcade"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Arcade</a>
    <div class="seg" id="seg" role="group" aria-label="Difficulty">
      <button data-d="easy" aria-pressed="true">Easy</button>
      <button data-d="medium" aria-pressed="false">Medium</button>
      <button data-d="hard" aria-pressed="false">Hard</button>
    </div>
    <button class="iconbtn" id="snd" aria-label="Toggle sound">
      <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 19V5L7.5 9.5z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 010 7M18 6a8.5 8.5 0 010 12"/></svg>
      <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 19V5L7.5 9.5z" fill="currentColor"/><path d="M16 9l5 6M21 9l-5 6"/></svg>
    </button>
  </div>

  <div class="stats">
    <div class="stat"><span class="l">MINES</span><span class="v" id="mc">10</span></div>
    <button class="restart" id="restart" aria-label="Restart">
      <svg viewBox="0 0 24 24" fill="none" stroke="#eafcff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 11-2.6-5.9"/><path d="M20 4v5h-5"/></svg>
      <span class="tip">TAP AGAIN</span>
    </button>
    <div class="stat r"><span class="l">TIME</span><span class="v" id="tm">0:00</span><span class="b" id="bt">BEST --</span></div>
  </div>

  <div class="wrap" id="wrap">
    <div class="frame" id="frame">
      <span class="tag">MINES</span><span class="tag r" id="tagr">SECTOR 9x9</span>
      <div class="board" id="board"></div>
    </div>
  </div>

  <div class="dock">
    <div class="mode" id="mode" data-m="dig" role="group" aria-label="Tap mode">
      <div class="thumb"></div>
      <button data-m="dig" aria-label="Dig mode"><span class="row"><svg><use href="#i-dig"/></svg>DIG</span><span>HOLD = FLAG</span></button>
      <button data-m="flag" aria-label="Flag mode"><span class="row"><svg><use href="#i-flag"/></svg>FLAG</span><span>HOLD = DIG</span></button>
    </div>
  </div>

  <div class="ov" id="ov">
    <div class="card" id="card">
      <h2 id="ovt">Cleared</h2>
      <div class="big" id="ovb">0:00</div>
      <p id="ovp"></p>
      <div id="ovn"></div>
      <div class="btns">
        <button class="btn pri" id="again">Play again</button>
        <button class="btn sec" id="view">View board</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';
var DIFFS={easy:{r:9,c:9,m:10},medium:{r:14,c:10,m:25},hard:{r:18,c:12,m:45}};
var K_SAVE='mines.save.v1.',K_BEST='mines.best.v1',K_DIFF='mines.diff.v1',K_SND='mines.sound.v1',K_MODE='mines.mode.v1';
var $=function(id){return document.getElementById(id)};
var board=$('board'),wrap=$('wrap'),frame=$('frame');

function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
function vibrate(p){try{if(navigator.vibrate)navigator.vibrate(p)}catch(e){}}

var G=null, mode=(lsGet(K_MODE)==='flag')?'flag':'dig', soundOn=lsGet(K_SND)!=='0';
var cells=[], view=[], diff='easy';
var timer={running:false,t0:0,base:0};
var overlayTimer=0;

/* ---------- audio ---------- */
var ac=null;
function ensureAudio(){
  if(!ac){try{var A=window.AudioContext||window.webkitAudioContext;if(A)ac=new A()}catch(e){ac=null}}
  if(ac&&ac.state==='suspended'){try{ac.resume()}catch(e){}}
}
function tone(f,dur,type,vol,delay,f2){
  if(!soundOn||!ac)return;
  try{
    var t=ac.currentTime+(delay||0),o=ac.createOscillator(),g=ac.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);
    if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.1,t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur+0.02);
  }catch(e){}
}
function noise(dur,vol){
  if(!soundOn||!ac)return;
  try{
    var n=Math.floor(ac.sampleRate*dur),b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);
    for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
    var s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
    s.buffer=b;f.type='lowpass';f.frequency.value=900;g.gain.value=vol;
    s.connect(f);f.connect(g);g.connect(ac.destination);s.start();
  }catch(e){}
}
var SND={
  dig:function(){tone(560,.07,'triangle',.12,0,380)},
  cascade:function(n){var k=Math.min(7,2+Math.floor(n/4));for(var i=0;i<k;i++)tone(380+i*70,.09,'triangle',.07,i*.045)},
  flag:function(){tone(900,.05,'square',.05);tone(1200,.05,'square',.04,.05)},
  unflag:function(){tone(600,.06,'square',.04,0,380)},
  chord:function(){tone(440,.06,'triangle',.1);tone(660,.08,'triangle',.1,.05)},
  nope:function(){tone(180,.09,'sawtooth',.05)},
  lp:function(){tone(300,.05,'sine',.06,0,500)},
  boom:function(){noise(.75,.5);tone(110,.6,'sine',.35,0,35)},
  win:function(){[523,659,784,1047,1319].forEach(function(f,i){tone(f,.28,'triangle',.12,i*.11)})}
};

/* ---------- time ---------- */
function elapsed(){return timer.base+(timer.running?performance.now()-timer.t0:0)}
function tStart(){if(!timer.running){timer.running=true;timer.t0=performance.now()}}
function tStop(){if(timer.running){timer.base+=performance.now()-timer.t0;timer.running=false}}
function fmt(ms){var s=Math.floor(ms/1000),m=Math.floor(s/60);s=s%60;return m+':'+(s<10?'0':'')+s}
function fmtT(ms){var s=ms/1000,m=Math.floor(s/60);s=s-m*60;return m+':'+(s<10?'0':'')+s.toFixed(1)}
function drawTime(){$('tm').textContent=fmt(elapsed())}
setInterval(function(){if(timer.running)drawTime()},200);

/* ---------- best ---------- */
function bests(){try{return JSON.parse(lsGet(K_BEST)||'{}')||{}}catch(e){return {}}}
function drawBest(){var b=bests()[diff];$('bt').textContent='BEST '+(b?fmt(b):'--')}

/* ---------- game ---------- */
function newGame(d,saved){
  diff=d;var D=DIFFS[d];
  G={d:d,R:D.r,C:D.c,M:D.m,N:D.r*D.c,mine:new Uint8Array(D.r*D.c),cnt:new Uint8Array(D.r*D.c),st:new Uint8Array(D.r*D.c),
     status:'ready',placed:false,boom:-1,nb:[],revealed:0};
  for(var i=0;i<G.N;i++){
    var r=(i/G.C)|0,c=i%G.C,a=[];
    for(var dr=-1;dr<=1;dr++)for(var dc=-1;dc<=1;dc++){
      if(!dr&&!dc)continue;var rr=r+dr,cc=c+dc;
      if(rr>=0&&rr<G.R&&cc>=0&&cc<G.C)a.push(rr*G.C+cc);
    }
    G.nb.push(a);
  }
  timer.running=false;timer.base=0;
  if(saved){
    for(var j=0;j<G.N;j++){
      G.mine[j]=saved.m.charCodeAt(j)-48;
      var s=saved.s.charCodeAt(j)-48;G.st[j]=s;if(s===1)G.revealed++;
    }
    computeCounts();G.placed=true;G.status='playing';timer.base=saved.e||0;tStart();
  }
  $('mc').textContent=G.M-flagCount();
  $('tagr').textContent='SECTOR '+G.C+'x'+G.R;
  buildBoard();
  var segs=document.querySelectorAll('#seg button');
  for(var k=0;k<segs.length;k++)segs[k].setAttribute('aria-pressed',segs[k].dataset.d===d?'true':'false');
  $('ov').classList.remove('show');clearTimeout(overlayTimer);
  drawTime();drawBest();render(null);layout();
}
function computeCounts(){
  for(var i=0;i<G.N;i++){var n=0,a=G.nb[i];for(var k=0;k<a.length;k++)n+=G.mine[a[k]];G.cnt[i]=n}
}
function flagCount(){var n=0;for(var i=0;i<G.N;i++)if(G.st[i]===2)n++;return n}
function place(first){
  var ban={};ban[first]=1;G.nb[first].forEach(function(x){ban[x]=1});
  var pool=[];for(var i=0;i<G.N;i++)if(!ban[i])pool.push(i);
  for(var m=0;m<G.M;m++){var j=m+Math.floor(Math.random()*(pool.length-m));var t=pool[m];pool[m]=pool[j];pool[j]=t;G.mine[pool[m]]=1}
  computeCounts();G.placed=true;
}
function save(){
  if(!G)return;
  if(G.status==='playing'){
    var m='',s='';for(var i=0;i<G.N;i++){m+=G.mine[i];s+=G.st[i]}
    lsSet(K_SAVE+G.d,JSON.stringify({m:m,s:s,e:Math.round(elapsed())}));
  }else lsDel(K_SAVE+G.d);
}
function loadSaved(d){
  try{
    var raw=lsGet(K_SAVE+d);if(!raw)return null;
    var o=JSON.parse(raw),D=DIFFS[d];
    if(o&&typeof o.m==='string'&&typeof o.s==='string'&&o.m.length===D.r*D.c&&o.s.length===o.m.length&&/^[01]+$/.test(o.m)&&/^[012]+$/.test(o.s))return o;
  }catch(e){}
  return null;
}

/* reveal with flood; seeds = array of cells. returns false if mine hit */
function revealSeeds(seeds){
  var delays={},q=[],depth={},hit=-1;
  seeds.forEach(function(s){if(G.st[s]!==0)return;if(G.mine[s]){if(hit<0)hit=s;return}G.st[s]=1;G.revealed++;delays[s]=0;depth[s]=0;q.push(s)});
  if(hit>=0){return {hit:hit}}
  var n=0;
  for(var h=0;h<q.length;h++){
    var i=q[h];n++;
    if(G.cnt[i]===0){
      var a=G.nb[i];
      for(var k=0;k<a.length;k++){var j=a[k];
        if(G.st[j]===0&&!G.mine[j]){G.st[j]=1;G.revealed++;depth[j]=depth[i]+1;delays[j]=Math.min(depth[j]*38,760);q.push(j)}}
    }
  }
  return {delays:delays,count:n};
}
function afterReveal(res){
  if(res.hit!==undefined&&res.hit>=0){lose(res.hit);return}
  render(res.delays);
  if(res.count>3)SND.cascade(res.count);else SND.dig();
  if(G.revealed===G.N-G.M)win();else save();
}
function startIfNeeded(i){
  if(G.status==='ready'){place(i);G.status='playing';tStart()}
}
function dig(i){
  if(G.status==='won'||G.status==='lost')return;
  if(G.st[i]!==0)return;
  startIfNeeded(i);
  afterReveal(revealSeeds([i]));
}
function flag(i){
  if(G.status==='won'||G.status==='lost')return;
  if(G.st[i]===1)return;
  G.st[i]=G.st[i]===2?0:2;
  G.st[i]===2?SND.flag():SND.unflag();
  vibrate(10);
  $('mc').textContent=G.M-flagCount();
  render(null);save();
}
function chord(i){
  if(G.status!=='playing'||G.st[i]!==1||G.cnt[i]===0)return;
  var a=G.nb[i],f=0,hid=[];
  for(var k=0;k<a.length;k++){if(G.st[a[k]]===2)f++;else if(G.st[a[k]]===0)hid.push(a[k])}
  if(f!==G.cnt[i]||!hid.length){SND.nope();var el=cells[i];el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');return}
  SND.chord();
  afterReveal(revealSeeds(hid));
}
function tap(i){
  if(G.st[i]===1){chord(i);return}
  if(mode==='dig')dig(i);else flag(i);
}
function alt(i){
  if(G.st[i]===1){chord(i);return}
  if(mode==='dig')flag(i);else dig(i);
}

function finish(){tStop();drawTime();lsDel(K_SAVE+G.d)}
function lose(idx){
  G.status='lost';G.boom=idx;finish();
  SND.boom();vibrate([60,40,120]);
  // mine reveal order by distance from the blast
  var br=(idx/G.C)|0,bc=idx%G.C,ms=[];
  for(var i=0;i<G.N;i++)if(G.mine[i]&&G.st[i]!==2)ms.push(i);
  ms.sort(function(a,b){return dist(a)-dist(b)});
  function dist(x){var r=(x/G.C)|0,c=x%G.C;return Math.abs(r-br)+Math.abs(c-bc)}
  var d={};ms.forEach(function(m,k){d[m]=Math.min(k*40,900)});d[idx]=0;
  render(d);
  overlayTimer=setTimeout(function(){showOverlay(false)},1300);
}
function win(){
  G.status='won';
  for(var i=0;i<G.N;i++)if(G.mine[i])G.st[i]=2;
  finish();$('mc').textContent=0;
  var t=elapsed(),b=bests(),isNew=!b[G.d]||t<b[G.d];
  if(isNew){b[G.d]=Math.round(t);lsSet(K_BEST,JSON.stringify(b))}
  G.newBest=isNew;drawBest();
  render(null);SND.win();vibrate([30,50,30,50,80]);
  overlayTimer=setTimeout(function(){showOverlay(true)},1000);
}
function showOverlay(won){
  var card=$('card');card.className='card'+(won?'':' lose');
  $('ovt').textContent=won?'Field cleared':'Detonated';
  var t=elapsed();
  $('ovb').textContent=won?fmtT(t):fmt(t);
  var safe=G.N-G.M;
  $('ovp').textContent=won?('Best '+fmtT(bests()[G.d]||t)+' on '+cap(G.d)):(G.revealed+' of '+safe+' safe tiles cleared');
  $('ovn').innerHTML=(won&&G.newBest)?'<span class="newbest">NEW BEST</span>':'';
  $('ov').classList.add('show');
}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}

/* ---------- rendering ---------- */
var FLAG='<svg><use href="#i-flag"/></svg>',MINE='<svg><use href="#i-mine"/></svg>';
function buildBoard(){
  board.innerHTML='';cells=[];view=[];
  board.style.gridTemplateColumns='repeat('+G.C+',var(--cw))';
  var frag=document.createDocumentFragment();
  for(var i=0;i<G.N;i++){var d=document.createElement('div');d.className='c';d.dataset.i=i;frag.appendChild(d);cells.push(d);view.push('')}
  board.appendChild(frag);
}
function code(i){
  var s=G.st[i];
  if(G.status==='lost'){
    if(G.mine[i])return i===G.boom?'X':(s===2?'F':'M');
    if(s===2)return 'W';
    return s===1?'N'+G.cnt[i]:'H';
  }
  if(s===0)return 'H';
  if(s===2)return 'F';
  return 'N'+G.cnt[i];
}
function render(delays){
  var any=false;
  for(var i=0;i<G.N;i++){
    var c=code(i);if(c===view[i])continue;
    view[i]=c;var el=cells[i];
    var cls='c',html='';
    if(c==='F'){cls+=' f';html=FLAG}
    else if(c==='X'){cls+=' rv m hit';html=MINE}
    else if(c==='M'){cls+=' rv m';html=MINE}
    else if(c==='W'){cls+=' rv wrong f';html=FLAG}
    else if(c.charAt(0)==='N'){cls+=' rv';var n=+c.slice(1);if(n){cls+=' n'+n;html=n}}
    if(delays&&delays[i]!==undefined&&(c.charAt(0)==='N'||c==='X'||c==='M'||c==='W')){cls+=' pop';el.style.setProperty('--d',delays[i]+'ms');any=true}
    el.className=cls;el.innerHTML=html;
  }
  if(any)setTimeout(function(){for(var i=0;i<cells.length;i++)cells[i].classList.remove('pop')},1500);
  if(G.status!=='won')$('mc').textContent=G.M-flagCount();
}
function layout(){
  if(!G)return;
  var w=wrap.clientWidth-4-10-2, h=wrap.clientHeight-8-10-2, gap=2;
  var cw=Math.floor((w-gap*(G.C-1))/G.C), ch=Math.floor((h-gap*(G.R-1))/G.R);
  var sh=Math.min(cw,ch,56), sw=Math.min(cw,Math.floor(sh*1.32),56);
  if(sh<10)sh=10;if(sw<10)sw=10;
  var root=document.documentElement.style;
  root.setProperty('--cw',sw+'px');root.setProperty('--ch',sh+'px');
  root.setProperty('--fs',Math.max(12,Math.floor(Math.min(sw,sh)*0.68))+'px');
}
window.addEventListener('resize',layout);
window.addEventListener('orientationchange',function(){setTimeout(layout,150)});
if(window.ResizeObserver)new ResizeObserver(layout).observe(wrap);

/* ---------- input ---------- */
var press=null;
function cancelPress(){
  if(!press)return;
  clearTimeout(press.t1);clearTimeout(press.t2);
  if(press.el)press.el.classList.remove('lp');
  press=null;
}
board.addEventListener('contextmenu',function(e){e.preventDefault()});
board.addEventListener('selectstart',function(e){e.preventDefault()});
board.addEventListener('dragstart',function(e){e.preventDefault()});
document.addEventListener('pointerdown',ensureAudio,{passive:true});
board.addEventListener('pointerdown',function(e){
  var el=e.target.closest?e.target.closest('.c'):null;if(!el||!G)return;
  var i=+el.dataset.i;
  if(G.status==='won'||G.status==='lost')return;
  if(e.pointerType==='mouse'){
    if(e.button===1){e.preventDefault();chord(i);return}
    if(e.button===2){e.preventDefault();flag(i);return}
    if(e.button===0){press={i:i,mouse:true,chorded:false}}
    return;
  }
  if(press)return;
  e.preventDefault();
  press={i:i,id:e.pointerId,x:e.clientX,y:e.clientY,fired:false,el:el};
  var p=press;
  p.t1=setTimeout(function(){el.classList.add('lp')},90);
  p.t2=setTimeout(function(){
    p.fired=true;el.classList.remove('lp');vibrate(22);SND.lp();alt(i);
  },350);
});
window.addEventListener('pointermove',function(e){
  if(!press)return;
  if(press.mouse){
    if(e.buttons===3&&!press.chorded){press.chorded=true;chord(press.i)}
    return;
  }
  if(e.pointerId!==press.id)return;
  var dx=e.clientX-press.x,dy=e.clientY-press.y;
  if(dx*dx+dy*dy>196&&!press.fired)cancelPress();
});
window.addEventListener('pointerup',function(e){
  if(!press)return;
  if(press.mouse){
    if(e.button===0){var p=press;press=null;if(!p.chorded&&G.status!=='won'&&G.status!=='lost')dig(p.i)}
    return;
  }
  if(e.pointerId!==press.id)return;
  var p2=press;cancelPress();
  if(!p2.fired)tap(p2.i);
});
window.addEventListener('pointercancel',function(){cancelPress()});
window.addEventListener('blur',cancelPress);

/* ---------- controls ---------- */
function setMode(m){
  mode=m;$('mode').dataset.m=m;lsSet(K_MODE,m);vibrate(8);
}
$('mode').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;setMode(b.dataset.m);
});
$('seg').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b||b.dataset.d===diff)return;
  save();lsSet(K_DIFF,b.dataset.d);
  newGame(b.dataset.d,loadSaved(b.dataset.d));
});
var armTimer=0;
function disarm(){clearTimeout(armTimer);$('restart').classList.remove('armed')}
$('restart').addEventListener('click',function(){
  var inProg=G.status==='playing'&&G.revealed>0;
  var btn=$('restart');
  if(inProg&&!btn.classList.contains('armed')){btn.classList.add('armed');armTimer=setTimeout(disarm,2200);return}
  disarm();lsDel(K_SAVE+diff);newGame(diff,null);
});
$('again').addEventListener('click',function(){lsDel(K_SAVE+diff);newGame(diff,null)});
$('view').addEventListener('click',function(){$('ov').classList.remove('show')});
function paintSound(){$('snd').classList.toggle('muted',!soundOn)}
$('snd').addEventListener('click',function(){
  soundOn=!soundOn;lsSet(K_SND,soundOn?'1':'0');paintSound();ensureAudio();if(soundOn)SND.flag();
});

/* ---------- lifecycle ---------- */
document.addEventListener('visibilitychange',function(){
  if(!G)return;
  if(document.hidden){if(G.status==='playing'){tStop();save()}cancelPress()}
  else if(G.status==='playing'){tStart()}
});
window.addEventListener('pagehide',function(){if(G&&G.status==='playing'){tStop();save()}});

/* ---------- init ---------- */
(function(){
  var d=lsGet(K_DIFF);if(!DIFFS[d])d='easy';
  paintSound();$('mode').dataset.m=mode;
  newGame(d,loadSaved(d));
  setTimeout(layout,0);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(layout);
})();
})();
</script>
</body>
